name: Check

on:
  pull_request_target:
    branches:
      - {{BRANCH}}

permissions:
  contents: read

jobs:
  check:
    name: Check packages
    runs-on: ubuntu-latest

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build crater
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 https://github.com/{{CRATER_REPO}}.git crater
          dotnet publish crater/src/Crater --configuration Release --output crater-bin

      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check registry
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.base_ref }}
        run: dotnet "$RUNNER_TEMP/crater-bin/crater.dll" registry check . --base "$BASE" --author "$AUTHOR"
