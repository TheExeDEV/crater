name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ github.ref_name }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          dotnet publish src/Crater \
            --configuration Release \
            --runtime "$RID" \
            --self-contained \
            --output out \
            -p:PublishSingleFile=true \
            -p:Version="${VERSION#v}" \
            -p:CraterUpdateRepo="$UPDATE_REPO"

          extension=""

          if [[ "$RID" == win-* ]]; then
            extension=".exe"
          fi

          mkdir -p dist
          cp "out/crater$extension" "dist/crater-$RID$extension"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crater-${{ matrix.rid }}
          path: dist/*

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes
